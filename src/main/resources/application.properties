spring.application.name=backend

# Real values live in application-local.properties (gitignored) for local dev,
# or in real environment variables for other environments.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
cors.allowed-origin=http://localhost:4000

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=2592000000

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.application.name=backend

# Real values live in application-local.properties (gitignored) for local dev,
# or in real environment variables for other environments.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# data.sql이 Hibernate의 테이블 생성(ddl-auto=update) 이후에 실행되도록 순서를 미룸.
# 기본값이면 data.sql이 먼저 실행되어 "테이블이 없다" 에러가 남.
spring.jpa.defer-datasource-initialization=true
# 운영 DB(H2가 아닌 실제 Postgres)에서는 기본적으로 data.sql을 실행하지 않으므로 always로 강제.
spring.sql.init.mode=always

cors.allowed-origin=http://localhost:4000

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=2592000000

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
